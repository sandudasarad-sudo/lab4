<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Student Marks</title>
</head>

<body>

<h1>Add Student Marks</h1>

<form action="add" method="post">

    <label>Name:</label>
    <br>

    <input type="text"
           name="name"
           placeholder="Enter student name"
           required>

    <br><br>

    <label>Marks:</label>
    <br>

    <input type="number"
           name="marks"
           placeholder="Enter marks"
           required>

    <br><br>

    <button type="submit">Add Student</button>

</form>

</body>
</html>
